<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大厅 · 离线预览</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><h1><em>环球大亨</em>｜资本博弈</h1><span class="sub">GLOBAL TYCOON</span></div><button class="ghost">规则速查</button></header>
<div class="view"><div class="card center">
<div class="brand-mark"><div class="t serif"><em>环球大亨</em></div><div class="s">GLOBAL TYCOON · 资本博弈</div></div>
<div class="rule"></div><div class="field"><label>玩家昵称</label><input id="nickname" maxlength="12" placeholder="请输入你的昵称" value="玩家A"></div>

<div class="field"><label>输入房间码加入对局</label><div class="row"><input class="mono" maxlength="6" placeholder="000000" value="358959" style="flex:1"><button class="secondary" style="width:118px;flex:none">加入房间</button></div></div>

<script src="preview.js"></script>
</body></html>
