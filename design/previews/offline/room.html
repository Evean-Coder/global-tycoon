<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>房间 · 离线预览</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><h1><em>环球大亨</em>｜资本博弈</h1><span class="sub">GLOBAL TYCOON</span></div><button class="ghost">规则速查</button></header>
<div class="view"><div class="card center"><h2>房间</h2>
<div class="codebox"><label>房间编号</label><div class="row"><span class="mono big">358959</span><button class="textbtn">复制房间码</button></div></div>
<div class="rule"></div><div class="field"><label>玩家列表</label><ul class="players">
<li>玩家A <span class="badge host">房主</span> <span class="dot on"></span></li>
<li>玩家B <span class="dot on"></span></li>
<li>玩家C <span class="badge off">已离线</span> <span class="dot off"></span></li>
<li class="slot">等待玩家加入…</li></ul></div>
<div class="rule"></div><button class="primary block">开始游戏</button><button class="secondary block">退出房间</button>
<p class="hint center">至少 2 名玩家才可开始游戏</p></div></div>
<script src="preview.js"></script>
</body></html>
